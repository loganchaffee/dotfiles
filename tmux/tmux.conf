# Reload config key binding
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!                                                                                                                                                                                                  "

# Change prefix key binding
set -g prefix C-space
unbind C-b
bind-key C-space send-prefix

# Vim motion key bindings
set -g mode-keys vi
set-window-option -g mode-keys vi
set -g focus-events on
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# Copy mode vim bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Mouse support
set -g mouse on

# Start window and pane numbers at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster escape for vim
set -s escape-time 0

# Open new panes/windows in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status Bar
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 100
set -g status-right-length 100

# Remove default spacing
set -g status-left ""
set -g window-status-separator " "

# Inactive window
set -g window-status-format \
"#[fg=#585b70,bg=#1e1e2e]█#[fg=#cdd6f4,bg=#585b70] #I #W #[fg=#585b70,bg=#1e1e2e]█"

# Active window
set -g window-status-current-format \
"#[fg=#89b4fa,bg=#1e1e2e,nounderscore]█#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W #[fg=#89b4fa,bg=#1e1e2e]█"

# Session
set -g status-right \
"#[fg=#a6da95,bg=#1e1e2e]█#[fg=#1e1e2e,bg=#a6da95] 󰆍 #S #[fg=#a6da95,bg=#1e1e2e]█"

# Command prompt styling
set -g message-style "bg=#89b4fa,fg=#1e1e2e,fill=#89b4fa"
set -g message-command-style "bg=#89b4fa,fg=#1e1e2e,fill=#89b4fa"
set -g prompt-cursor-colour "#1e1e2e"

# Fill the entire status line with the prompt background
set -g message-format "#{?command_prompt,#[bg=#89b4fa]#[fg=#1e1e2e]#{message},#[bg=#89b4fa]#[fg=#1e1e2e]#{message}}"

# Copy mode selection color
set -g mode-style "bg=#cba6f7,fg=#1e1e2e"
set -g copy-mode-selection-style "bg=#89b4fa,fg=#1e1e2e"

# =========================
# Plugins
# =========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep last)
run '~/.config/tmux/plugins/tpm/tpm'
